        <ellipse cx="0" cy="-7" rx="5" ry="7.2" transform="rotate(0)"/><ellipse cx="0" cy="-7" rx="5" ry="7.2" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7" rx="5" ry="7.2" transform="rotate(144)"/><ellipse cx="0" cy="-7" rx="5" ry="7.2" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7" rx="5" ry="7.2" transform="rotate(288)"/><circle r="3" fill="#FFD98A"/>
      </g>
      <g id="spRose">
        <circle r="11" fill="#F48FB1"/><path d="M-8 -2c2-7 13-8 15 0-3-3-8-3-10 1 4-1 7 2 6 6-5-4-11-2-11-7z" fill="#EC407A"/>
        <path d="M-3 -4c3-3 7-2 7 2-2-1-4 0-5 2-1-2-2-3-2-4z" fill="#C2185B"/>
      </g>
      <ellipse id="spLeaf" cx="0" cy="0" rx="9" ry="3.8" fill="#9CCB9F"/>
    </defs>
    <g class="sp-garland">
      <use href="#spLeaf" class="lf" transform="translate(40 152) rotate(-60) scale(1.5)" style="--d:0.1s"/><use href="#spLeaf" class="lf" transform="translate(320 152) rotate(60) scale(1.5)" style="--d:0.15s"/><use href="#spLeaf" class="lf" transform="translate(84 122) rotate(-40) scale(1.5)" style="--d:0.2s"/><use href="#spLeaf" class="lf" transform="translate(276 122) rotate(40) scale(1.5)" style="--d:0.25s"/><use href="#spLeaf" class="lf" transform="translate(134 92) rotate(-18) scale(1.5)" style="--d:0.3s"/><use href="#spLeaf" class="lf" transform="translate(226 92) rotate(18) scale(1.5)" style="--d:0.35s"/>
      <g class="bl" transform="translate(28 172) scale(1.7)"><use href="#spFlower" fill="#F8BBD0" style="--d:0.15s"/></g><g class="bl" transform="translate(58 132) scale(2)"><use href="#spRose" style="--d:0.3s"/></g><g class="bl" transform="translate(104 112) scale(1.7)"><use href="#spFlower" fill="#F48FB1" style="--d:0.45s"/></g>

      <g class="bl" transform="translate(256 112) scale(1.7)"><use href="#spFlower" fill="#F06292" style="--d:1.05s"/></g><g class="bl" transform="translate(302 132) scale(2)"><use href="#spRose" style="--d:1.2s"/></g><g class="bl" transform="translate(332 172) scale(1.7)"><use href="#spFlower" fill="#F8BBD0" style="--d:1.35s"/></g>
    </g>
    <text class="sp-word" x="180" y="262" text-anchor="middle" fill="url(#spInk)">الإحسان</text>

  </svg>
  <p class="sp-sub">لتحفيظ القرآن الكريم</p>
  <i class="petal" style="--x:12%;--d:.4s;--t:4.2s"></i><i class="petal" style="--x:30%;--d:1.1s;--t:3.6s"></i>
  <i class="petal" style="--x:58%;--d:.2s;--t:4.6s"></i><i class="petal" style="--x:78%;--d:.9s;--t:3.9s"></i><i class="petal" style="--x:90%;--d:1.5s;--t:4.4s"></i>

<script>
  // يختفي بعد انتهاء الحركة (2.6 ثانية) أو عند جهوزية التطبيق، أيهما أبعد
  (function () {
    var s = document.getElementById('splash'), t0 = Date.now(), done = false;
    window.hideSplash = function () {
      if (done) return; done = true;
      setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 650); }, Math.max(0, 2600 - (Date.now() - t0)));
    };
    setTimeout(window.hideSplash, 5000);
  })();
</script>
